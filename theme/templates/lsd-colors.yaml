# generated by theme/build.sh ({{theme}}). Edit theme/themes/{{theme}}/colors.env instead.
# File and directory name colors come from LS_COLORS (zsh/.config/zsh/ls_colors.zsh).
user: "{{yellow}}"
group: "{{fg_dim}}"
permission:
  read: "{{green}}"
  write: "{{yellow}}"
  exec: "{{red}}"
  exec-sticky: "{{magenta}}"
  no-access: "{{bright_black}}"
  octal: "{{cyan}}"
  acl: "{{cyan}}"
  context: "{{cyan}}"
date:
  hour-old: "{{green}}"
  day-old: "{{cyan}}"
  older: "{{fg_dim}}"
size:
  none: "{{bright_black}}"
  small: "{{fg}}"
  medium: "{{yellow}}"
  large: "{{orange}}"
inode:
  valid: "{{magenta}}"
  invalid: "{{bright_black}}"
links:
  valid: "{{magenta}}"
  invalid: "{{bright_black}}"
tree-edge: "{{bright_black}}"
git-status:
  default: "{{fg_dim}}"
  unmodified: "{{fg_dim}}"
  ignored: "{{bright_black}}"
  new-in-index: "{{green}}"
  new-in-workdir: "{{green}}"
  typechange: "{{yellow}}"
  deleted: "{{red}}"
  renamed: "{{green}}"
  modified: "{{yellow}}"
  conflicted: "{{red}}"
