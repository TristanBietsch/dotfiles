# generated by theme/build.sh ({{theme}}). Edit theme/themes/{{theme}}/colors.env instead.
# Minimal chrome (fg on bg), same as yazi and tmux. Color only where it carries meaning.
# Loaded via LG_CONFIG_FILE (set in ~/.zshrc), so the path is the same on every OS.

gui:
  theme:
    activeBorderColor: ["{{fg}}", bold]
    inactiveBorderColor: ["{{border}}"]
    searchingActiveBorderColor: ["{{blue}}", bold]
    optionsTextColor: ["{{fg_dim}}"]
    selectedLineBgColor: ["{{selection_bg}}"]
    inactiveViewSelectedLineBgColor: [bold]
    cherryPickedCommitFgColor: ["{{bg}}"]
    cherryPickedCommitBgColor: ["{{cyan}}"]
    markedBaseCommitFgColor: ["{{bg}}"]
    markedBaseCommitBgColor: ["{{yellow}}"]
    unstagedChangesColor: ["{{red}}"]
    defaultFgColor: ["{{fg}}"]

  # Only the panels used day to day; the rest stay one tab away.
  sidePanels:
    - [status]
    - [files]
    - [branches, remotes, tags]
    - [commits, reflog]
    - [stash]

  border: single
  nerdFontsVersion: "3"
  showFileIcons: true
  showRandomTip: false
  showCommandLog: false
  showBottomLine: false
  showPanelJumps: false
  showListFooter: false
  animateExplosion: false

# brew manages updates.
update:
  method: never

disableStartupPopups: true
