# generated by theme/build.sh ({{theme}}). Edit theme/themes/{{theme}}/colors.env instead.
# Minimal chrome (fg on bg). Color goes to file names and icons, same roles as lsd and neo-tree.

[mgr]
cwd = { fg = "{{fg}}", bold = true }

find_keyword  = { fg = "{{fg}}", bold = true, underline = true }
find_position = { fg = "{{fg_dim}}", italic = true }

symlink_target = { fg = "{{symlink}}", italic = true }

marker_copied   = { fg = "{{fg}}", bg = "{{fg}}" }
marker_cut      = { fg = "{{bright_black}}", bg = "{{bright_black}}" }
marker_marked   = { fg = "{{fg_dim}}", bg = "{{fg_dim}}" }
marker_selected = { fg = "{{fg}}", bg = "{{fg}}" }
marker_symbol   = "│"

count_copied   = { fg = "{{bg}}", bg = "{{fg}}" }
count_cut      = { fg = "{{bg}}", bg = "{{fg_dim}}" }
count_selected = { fg = "{{bg}}", bg = "{{fg}}" }

border_symbol = "│"
border_style  = { fg = "{{border}}" }

[tabs]
active    = { fg = "{{bg}}", bg = "{{fg}}" }
inactive  = { fg = "{{fg}}" }
sep_inner = { open = " ", close = " " }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "{{bg}}", bg = "{{fg}}" }
normal_alt  = { fg = "{{fg}}" }
select_main = { fg = "{{bg}}", bg = "{{fg_dim}}" }
select_alt  = { fg = "{{fg_dim}}" }
unset_main  = { fg = "{{bg}}", bg = "{{fg_dim}}" }
unset_alt   = { fg = "{{fg_dim}}" }

[indicator]
parent  = { fg = "{{bg}}", bg = "{{fg_dim}}" }
current = { fg = "{{bg}}", bg = "{{fg}}" }
preview = { underline = true }
padding = { open = "", close = "" }

[status]
overall   = {}
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

perm_sep   = { fg = "{{bright_black}}" }
perm_type  = { fg = "{{fg}}" }
perm_read  = { fg = "{{fg_dim}}" }
perm_write = { fg = "{{fg_dim}}" }
perm_exec  = { fg = "{{fg_dim}}" }

progress_label  = { fg = "{{fg}}" }
progress_normal = { fg = "{{fg}}", bg = "{{bg}}" }
progress_error  = { fg = "{{red}}", bg = "{{bg}}" }

[which]
border          = { fg = "{{border}}" }
cand            = { fg = "{{fg}}", bold = true }
rest            = { fg = "{{bright_black}}" }
desc            = { fg = "{{fg_dim}}" }
separator_style = { fg = "{{bright_black}}" }

[confirm]
border  = { fg = "{{border}}" }
title   = { fg = "{{fg}}" }
btn_yes = { fg = "{{bg}}", bg = "{{fg}}" }

[spot]
border   = { fg = "{{border}}" }
title    = { fg = "{{fg}}" }
tbl_col  = { fg = "{{fg}}" }
tbl_cell = { fg = "{{bg}}", bg = "{{fg}}" }

[notify]
title_info  = { fg = "{{fg}}" }
title_warn  = { fg = "{{yellow}}" }
title_error = { fg = "{{red}}" }

[pick]
border = { fg = "{{border}}" }
active = { fg = "{{bg}}", bg = "{{fg}}" }

[input]
border   = { fg = "{{border}}" }
selected = { fg = "{{bg}}", bg = "{{fg}}" }

[cmp]
border = { fg = "{{border}}" }
active = { fg = "{{bg}}", bg = "{{fg}}" }

[tasks]
border  = { fg = "{{border}}" }
hovered = { fg = "{{bg}}", bg = "{{fg}}" }

[help]
border  = { fg = "{{border}}" }
chord   = { fg = "{{fg}}", bold = true }
hovered = { fg = "{{bg}}", bg = "{{fg}}" }

[filetype]
rules = [
	{ url = "*", is = "orphan", fg = "{{orphan}}" },
	{ url = "*", is = "link", fg = "{{symlink}}", italic = true },
	{ url = "*/", fg = "{{dir}}", bold = true },
	{ url = "*", is = "exec", fg = "{{exec}}" },
	{ url = "*.{{{ext_image.glob}}}", fg = "{{image}}" },
	{ url = "*.{{{ext_media.glob}}}", fg = "{{media}}" },
	{ url = "*.{{{ext_archive.glob}}}", fg = "{{archive}}" },
	{ url = "*.{{{ext_document.glob}}}", fg = "{{document}}" },
	{ url = "*", fg = "{{file}}" },
]

[icon]
# one folder glyph everywhere (matches neo-tree and lsd); file icons keep yazi defaults
dirs = []
prepend_conds = [
	{ if = "dir & hovered", text = "{{icon_dir_open}}", fg = "{{dir}}" },
	{ if = "dir", text = "{{icon_dir}}", fg = "{{dir}}" },
]
