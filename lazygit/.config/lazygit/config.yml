# generated by theme/build.sh (hackfast). Edit theme/themes/hackfast/colors.env instead.
# Minimal chrome (fg on bg), same as yazi and tmux. Color only where it carries meaning.
# Loaded via LG_CONFIG_FILE (set in ~/.zshrc), so the path is the same on every OS.

gui:
  theme:
    activeBorderColor: ["#f0f6f6", bold]
    inactiveBorderColor: ["#484f58"]
    searchingActiveBorderColor: ["#58a6ff", bold]
    optionsTextColor: ["#8b949e"]
    selectedLineBgColor: ["#264f78"]
    inactiveViewSelectedLineBgColor: [bold]
    cherryPickedCommitFgColor: ["#000000"]
    cherryPickedCommitBgColor: ["#39c5cf"]
    markedBaseCommitFgColor: ["#000000"]
    markedBaseCommitBgColor: ["#d29922"]
    unstagedChangesColor: ["#ff7b72"]
    defaultFgColor: ["#f0f6f6"]

  # Only the panels used day to day; the rest stay one tab away.
  sidePanels:
    - [status]
    - [files]
    - [branches, remotes, tags]
    - [commits, reflog]
    - [stash]

  border: single
  nerdFontsVersion: "3"
  showFileIcons: true
  showRandomTip: false
  showCommandLog: false
  showBottomLine: false
  showPanelJumps: false
  showListFooter: false
  animateExplosion: false

# brew manages updates.
update:
  method: never

disableStartupPopups: true
