# generated by theme/build.sh (hackfast). Edit theme/themes/hackfast/colors.env instead.
# Minimal chrome (fg on bg). Color goes to file names and icons, same roles as lsd and neo-tree.

[mgr]
cwd = { fg = "#f0f6f6", bold = true }

find_keyword  = { fg = "#f0f6f6", bold = true, underline = true }
find_position = { fg = "#8b949e", italic = true }

symlink_target = { fg = "#39c5cf", italic = true }

marker_copied   = { fg = "#f0f6f6", bg = "#f0f6f6" }
marker_cut      = { fg = "#6e7681", bg = "#6e7681" }
marker_marked   = { fg = "#8b949e", bg = "#8b949e" }
marker_selected = { fg = "#f0f6f6", bg = "#f0f6f6" }
marker_symbol   = "│"

count_copied   = { fg = "#000000", bg = "#f0f6f6" }
count_cut      = { fg = "#000000", bg = "#8b949e" }
count_selected = { fg = "#000000", bg = "#f0f6f6" }

border_symbol = "│"
border_style  = { fg = "#484f58" }

[tabs]
active    = { fg = "#000000", bg = "#f0f6f6" }
inactive  = { fg = "#f0f6f6" }
sep_inner = { open = " ", close = " " }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#000000", bg = "#f0f6f6" }
normal_alt  = { fg = "#f0f6f6" }
select_main = { fg = "#000000", bg = "#8b949e" }
select_alt  = { fg = "#8b949e" }
unset_main  = { fg = "#000000", bg = "#8b949e" }
unset_alt   = { fg = "#8b949e" }

[indicator]
parent  = { fg = "#000000", bg = "#8b949e" }
current = { fg = "#000000", bg = "#f0f6f6" }
preview = { underline = true }
padding = { open = "", close = "" }

[status]
overall   = {}
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

perm_sep   = { fg = "#6e7681" }
perm_type  = { fg = "#f0f6f6" }
perm_read  = { fg = "#8b949e" }
perm_write = { fg = "#8b949e" }
perm_exec  = { fg = "#8b949e" }

progress_label  = { fg = "#f0f6f6" }
progress_normal = { fg = "#f0f6f6", bg = "#000000" }
progress_error  = { fg = "#ff7b72", bg = "#000000" }

[which]
border          = { fg = "#484f58" }
cand            = { fg = "#f0f6f6", bold = true }
rest            = { fg = "#6e7681" }
desc            = { fg = "#8b949e" }
separator_style = { fg = "#6e7681" }

[confirm]
border  = { fg = "#484f58" }
title   = { fg = "#f0f6f6" }
btn_yes = { fg = "#000000", bg = "#f0f6f6" }

[spot]
border   = { fg = "#484f58" }
title    = { fg = "#f0f6f6" }
tbl_col  = { fg = "#f0f6f6" }
tbl_cell = { fg = "#000000", bg = "#f0f6f6" }

[notify]
title_info  = { fg = "#f0f6f6" }
title_warn  = { fg = "#d29922" }
title_error = { fg = "#ff7b72" }

[pick]
border = { fg = "#484f58" }
active = { fg = "#000000", bg = "#f0f6f6" }

[input]
border   = { fg = "#484f58" }
selected = { fg = "#000000", bg = "#f0f6f6" }

[cmp]
border = { fg = "#484f58" }
active = { fg = "#000000", bg = "#f0f6f6" }

[tasks]
border  = { fg = "#484f58" }
hovered = { fg = "#000000", bg = "#f0f6f6" }

[help]
border  = { fg = "#484f58" }
chord   = { fg = "#f0f6f6", bold = true }
hovered = { fg = "#000000", bg = "#f0f6f6" }

[filetype]
rules = [
	{ url = "*", is = "orphan", fg = "#ff7b72" },
	{ url = "*", is = "link", fg = "#39c5cf", italic = true },
	{ url = "*/", fg = "#58a6ff", bold = true },
	{ url = "*", is = "exec", fg = "#3fb950" },
	{ url = "*.{png,jpg,jpeg,gif,webp,svg,bmp,ico,heic,tiff}", fg = "#d29922" },
	{ url = "*.{mp3,flac,wav,ogg,m4a,aac,mp4,mkv,mov,avi,webm}", fg = "#bc8cff" },
	{ url = "*.{zip,tar,gz,tgz,xz,zst,bz2,7z,rar,dmg,iso}", fg = "#ff7b72" },
	{ url = "*.{pdf,doc,docx,rtf,epub,odt}", fg = "#39c5cf" },
	{ url = "*", fg = "#f0f6f6" },
]

[icon]
# one folder glyph everywhere (matches neo-tree and lsd); file icons keep yazi defaults
dirs = []
prepend_conds = [
	{ if = "dir & hovered", text = "", fg = "#58a6ff" },
	{ if = "dir", text = "", fg = "#58a6ff" },
]
